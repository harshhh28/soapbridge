name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on the homebrew-soapbridge repo —
          # the default GITHUB_TOKEN above only has access to *this* repo,
          # not the separate tap repo .goreleaser.yml's `brews:` section
          # pushes the formula to. Create it under Settings > Developer
          # settings > Personal access tokens (fine-grained, scoped to just
          # homebrew-soapbridge), then add it as a repo secret here named
          # HOMEBREW_TAP_GITHUB_TOKEN.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
